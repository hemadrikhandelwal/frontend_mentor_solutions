<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main class="flex min-h-screen justify-center items-center">
      <section class="product-card">
        <div class="flex flex-col md:flex-row">
          <div class="md:w-1/2 w-full">
            <img
              src="images/image-product-desktop.jpg"
              alt="product image"
              class="h-full w-full object-cover"
            />
          </div>
          <div class="md:w-1/2 w-full p-6 gap-4 flex flex-col">
            <h1 class="uppercase tracking-widest">Perfume</h1>
            <h2 class="font-black text-4xl">Gabrielle Essence Eau De Parfum</h2>
            <p>
              A floral, solar and voluptuous interpretation composed by Olivier
              Polge, Perfumer-Creator for the House of CHANEL.
            </p>
            <div class="flex items-center gap-4">
              <span class="color-green text-2xl font-bold">$149.99</span>
              <span class="line-through text-sm text-gray-400">$169.99</span>
            </div>

            <button
              class="rounded-lg grid grid-flow-col place-items-center justify-center gap-2 px-4 py-2"
            >
              <img src="images/icon-cart.svg" alt="icon cart button"  aria-hidden="true" />
              Add to Cart
            </button>
          </div>
        </div>
      </section>
    </main>
    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Hemadri Khandelwal</a>.
    </div>
  </body>
</html>
